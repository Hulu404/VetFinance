function lineChart(vals,labels,{height=198,forecast=-1,unit='тыс. ₽',color='var(--rose)'}={}){const w=720,h=height,pad=35,hi=Math.max(...vals)*1.12,lo=Math.min(0,...vals)*1.2;const points=vals.map((v,i)=>({x:pad+i*(w-2*pad)/(vals.length-1),y:20+(hi-v)/(hi-lo)*(h-62),v}));let path=points.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ');const y0=20+(hi/(hi-lo))*(h-62);return `<svg class="chart balance-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(labels.map((l,i)=>l+': '+money(vals[i])).join('; '))}"><defs><linearGradient id="area-${height}-${forecast}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E8446F" stop-opacity=".13"/><stop offset="1" stop-color="#E8446F" stop-opacity="0"/></linearGradient></defs>${[.2,.6,1].map(x=>`<line class="gridline" x1="${pad}" x2="${w-pad}" y1="${20+(h-62)*x}" y2="${20+(h-62)*x}"/>`).join('')}<path d="${path} L${w-pad},${y0} L${pad},${y0} Z" fill="url(#area-${height}-${forecast})"/>${forecast>0?`<path d="${points.slice(0,forecast+1).map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ')}" class="line" style="stroke:var(--ink)"/><path d="${points.slice(forecast).map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ')}" class="line" stroke-dasharray="6 5"/>`:`<path d="${path}" class="line" style="stroke:${color}"/>`}${points.map((p,i)=>`<g><circle cx="${p.x}" cy="${p.y}" r="4" fill="${forecast>0&&i<=forecast?'var(--ink)':color}" stroke="#fff" stroke-width="2"><title>${labels[i]}: ${money(p.v)}</title></circle>${vals.length<=8?`<text x="${p.x}" y="${p.y-12}" text-anchor="middle" class="label">${Math.abs(p.v)>=1e6?(p.v/1e6).toFixed(2).replace('.',',')+' млн':money(p.v/1000,false)+' тыс.'}</text>`:''}<text x="${p.x}" y="${h-8}" text-anchor="middle">${labels[i]}</text></g>`).join('')}${lo<0?`<line x1="${pad}" x2="${w-pad}" y1="${y0}" y2="${y0}" stroke="#b78498" stroke-dasharray="3 3"/>`:''}</svg>`}

const planDays=['2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07'];

function cashTimeline(){let balance=currentCash();const incoming=[65000,0,75000,55000,40000,0,60000];return planDays.map((date,i)=>{const outgoing=paymentItems().filter(p=>p.date===date).reduce((a,p)=>a+p.amount,0);balance+=incoming[i]-outgoing;return {date,incoming:incoming[i],outgoing,balance}})}
const cashGap=()=>cashTimeline()[1].balance;
function payments(){const data=cashTimeline(),min=Math.min(...data.map(d=>d.balance)),payments=paymentItems();return head('Платёжный календарь','1–7 октября · поступления и плановые выплаты.',B(ic('plus')+' Добавить платёж','add-payment','rose'))+`<div class="grid g3"><div class="card"><span class="eyebrow">Сейчас на счетах</span><h2 style="font-size:27px;margin-top:9px">${money(currentCash())}</h2></div><div class="card"><span class="eyebrow">Минимальный остаток</span><h2 class="${min<0?'negative':'positive'}" style="font-size:27px;margin-top:9px">${money(min)}</h2></div><div class="card"><span class="eyebrow">Остаток 7 октября</span><h2 style="font-size:27px;margin-top:9px">${money(data[6].balance)}</h2></div></div><div class="card mt"><div class="section-title"><h2>${min<0?'В прогнозе есть кассовый разрыв':'Платежи проходят без разрыва'}</h2>${tag(min<0?'Требует решения':'План сбалансирован',min<0?'':'green')}</div>${lineChart([currentCash(),...data.map(d=>d.balance)],['30 сен',...data.map(d=>d.date.slice(-2)+' окт')],{height:232})}<p class="hint">Прогноз = текущий остаток + ожидаемые поступления − платежи. Переносы меняют план, фактический баланс остаётся прежним.</p></div>${state.supplierDate==='2026-10-01'?`<div class="insight"><div class="insight-icon">${ic('spark')}</div><div class="text"><h3>Перенесите 65 000 ₽ поставщику на 5 октября</h3><p>После согласования с поставщиком: остаток 2 октября станет ${money(cashGap()+65000)}.</p></div>${B('Перенести платёж','move-supplier','rose sm')}</div>`:`<div class="insight ok"><div class="insight-icon">${ic('check')}</div><div class="text"><h3>Поставщик перенесён на ${state.supplierDate.slice(-2)} октября</h3><p>Изменение учтено в графике и ежедневном разборе.</p></div>${B('Вернуть дату','undo-supplier','white sm')}</div>`}<div class="card no-pad mt"><div class="section-title" style="padding:22px 22px 0"><h2>Предстоящие платежи</h2><span class="tiny muted">${payments.length} платежа · ${money(payments.reduce((a,p)=>a+p.amount,0))}</span></div><div class="table-scroll"><table><thead><tr><th>Дата</th><th>Платёж</th><th>Статья</th><th class="num">Сумма</th><th></th></tr></thead><tbody>${payments.map(p=>`<tr><td>${p.date.slice(-2)} октября</td><td><b>${esc(p.name)}</b>${p.id==='supplier'&&state.supplierDate!=='2026-10-01'?'<small class="positive">Перенесён с 1 октября</small>':''}</td><td>${tag(p.type,'gray')}</td><td class="num">${money(p.amount)}</td><td>${B(p.id==='supplier'?'Изменить':'Детали','payment','white sm',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div></div>`}
const stock=[{id:0,name:'Вакцина · комплекс A',batch:'VA-2604',qty:12,unit:'доз',cost:7200,expiry:'2026-10-08',days:8},{id:1,name:'Препарат B',batch:'AB-2511',qty:8,unit:'уп.',cost:6400,expiry:'2026-10-15',days:15},{id:2,name:'Инфузионный набор C',batch:'IN-2510',qty:11,unit:'шт.',cost:4400,expiry:'2026-10-24',days:24},{id:3,name:'Шовный материал',batch:'SH-2608',qty:45,unit:'уп.',cost:22500,expiry:'2027-08-20',days:324},{id:4,name:'Диагностический набор',batch:'DG-2607',qty:20,unit:'уп.',cost:14000,expiry:'2027-06-14',days:257}];
const stockRisk=()=>stock.filter(x=>x.days<=30&&!state.stockDone.includes(x.id)).reduce((a,x)=>a+x.cost,0);
function stockRows(){const list=stock.filter(x=>stockFilter==='all'||(stockFilter==='risk'?x.days<=30&&!state.stockDone.includes(x.id):state.stockDone.includes(x.id)));return list.length?list.map(x=>`<tr><td><button class="rowbtn" data-action="stock-detail" data-id="${x.id}">${x.name}</button><small>Партия ${x.batch}</small></td><td class="num">${x.qty} ${x.unit}</td><td>${x.expiry.split('-').reverse().join('.')}</td><td class="num">${money(x.cost)}</td><td>${state.stockDone.includes(x.id)?tag('Проверено','green'):tag(x.days<=30?x.days+' дн. до срока':'В норме',x.days<=30?'orange':'green')}</td><td>${B('Открыть','stock-detail','white sm',`data-id="${x.id}"`)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">В этой группе пока нет партий.</div></td></tr>`}
function stockPage(){return head('Склад и сроки','Следите за партиями до того, как они станут списанием.',B(ic('download')+' CSV','export-stock','white'))+`<div class="grid g3"><div class="card"><span class="eyebrow">На складе</span><h2 style="margin-top:10px">${money(stock.reduce((a,x)=>a+x.cost,0))}</h2></div><div class="card"><span class="eyebrow">Нужна проверка</span><h2 class="negative" style="margin-top:10px">${money(stockRisk())}</h2></div><div class="card"><span class="eyebrow">Проверено</span><h2 style="margin-top:10px">${state.stockDone.length} <span class="small muted">из ${stock.length} партий</span></h2></div></div><div class="card no-pad mt"><div class="filters"><div class="segments">${[['all','Все партии'],['risk','Близкий срок'],['done','Проверено']].map(([id,n])=>`<button class="${stockFilter===id?'active':''}" data-action="stock-filter" data-id="${id}">${n}</button>`).join('')}</div></div><div class="table-scroll"><table><thead><tr><th>Позиция</th><th class="num">Остаток</th><th>Срок годности</th><th class="num">Стоимость</th><th>Статус</th><th></th></tr></thead><tbody>${stockRows()}</tbody></table></div></div><div class="notice mt">Проверка партии фиксирует действие. Она не списывает препарат и не подтверждает экономию.</div>`}
const quarterLabels=['IV кв. 2026','I кв. 2027','II кв. 2027','III кв. 2027'];
function modelData(type=state.scenario){const params=type==='growth'?{growth:8,variable:59,fixed:336000}:type==='cautious'?{growth:-8,variable:65,fixed:350000}:type==='custom'?state.custom:{growth:0,variable:61.9,fixed:336000};return [4120000,3890000,4480000,4760000].map((b,i)=>{const revenue=Math.round(b*(1+params.growth/100)),variable=Math.round(revenue*params.variable/100),fixed=params.fixed*3,tax=Math.round(revenue*.03),contribution=revenue-variable,profit=contribution-fixed-tax;return {label:quarterLabels[i],revenue,variable,fixed,tax,contribution,profit,margin:profit/revenue*100}})}
const modelYear=arr=>arr.reduce((a,x)=>a+x.profit,0);
function modelResult(){const d=modelData(),base=modelData('base'),delta=modelYear(d)-modelYear(base);return `<div class="card"><div class="section-title"><div><h2>Выручка по кварталам</h2><p class="hint" style="margin-top:4px">Факт — тёмная линия, прогноз — пунктир</p></div><div class="model-total"><div><small>Прибыль за 12 месяцев</small><strong class="positive">${money(modelYear(d))}</strong></div></div></div>${lineChart([3720000,3470000,4020000,4125900,...d.map(x=>x.revenue)],['IV кв. 25','I кв. 26','II кв. 26','III кв. 26','IV кв. 26','I кв. 27','II кв. 27','III кв. 27'],{height:245,forecast:3})}<div class="flex" style="justify-content:space-between;margin-top:13px"><span class="small muted">К базовому сценарию</span><b class="${delta>=0?'positive':'negative'}">${delta>0?'+':''}${money(delta)} прибыли</b></div></div><div class="card no-pad mt"><div class="section-title" style="padding:22px 22px 0"><h2>Финансовый план</h2><span class="hint">Нажмите квартал для расчёта</span></div><div class="table-scroll"><table><thead><tr><th>Статья</th>${d.map((x,i)=>`<th class="num"><button class="rowbtn" style="font-size:10px" data-action="quarter" data-id="${i}">${x.label} ${ic('info')}</button></th>`).join('')}</tr></thead><tbody>${[['Выручка','revenue'],['Переменные расходы','variable'],['Маржинальная прибыль','contribution'],['Постоянные расходы','fixed'],['Налоги','tax'],['Чистая прибыль','profit'],['Рентабельность','margin']].map(([n,k])=>`<tr class="${k==='profit'?'totalrow':''}"><td>${n}</td>${d.map(x=>`<td class="num ${k==='profit'?'positive':['variable','fixed','tax'].includes(k)?'muted':''}">${k==='margin'?pct(x[k]):money(x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function modelPage(){return head('Финмодель и прогноз','План на четыре квартала. Меняйте предпосылки и сравнивайте результат.',B(ic('download')+' CSV','export-model','white')+B('Печать / PDF','print','white'))+`<div class="toolbar"><div class="segments">${[['base','Базовый'],['growth','С ростом'],['cautious','Осторожный'],['custom','Свой сценарий']].map(([id,t])=>`<button class="${state.scenario===id?'active':''}" data-action="scenario" data-id="${id}">${t}</button>`).join('')}</div><span class="hint">Сценарии — расчётные гипотезы</span></div>${state.scenario==='custom'?`<div class="card model-controls" style="margin-bottom:20px"><label class="field"><span class="range-label">Рост к базовой выручке <b id="growth-value">${state.custom.growth}%</b></span><input id="custom-growth" type="range" min="-20" max="30" step="1" value="${state.custom.growth}"></label><label class="field"><span class="range-label">Переменные расходы <b id="variable-value">${state.custom.variable}%</b></span><input id="custom-variable" type="range" min="45" max="75" step="0.1" value="${state.custom.variable}"></label><label class="field"><span class="range-label">Постоянные в месяц <b id="fixed-value">${money(state.custom.fixed)}</b></span><input id="custom-fixed" type="range" min="260000" max="460000" step="1000" value="${state.custom.fixed}"></label></div>`:''}<div id="model-result">${modelResult()}</div><div class="card mt"><div class="section-title"><h2>Как выйти на рост</h2>${B('Добавить шаги в план','add-growth-tasks','rose sm')}</div><div class="growth-steps"><div><b>01</b><strong>Пересмотреть ночные смены</strong><p>Проверить дежурство по вызову и стоимость суток стационара.</p></div><div><b>02</b><strong>Заполнить операционную</strong><p>Согласовать свободные часы и дополнительные плановые операции.</p></div><div><b>03</b><strong>Снизить долю закупок</strong><p>Сверить поставщиков, условия и расход препаратов на услугу.</p></div></div><p class="hint mt">Сценарий «С ростом»: выручка +8%, переменные расходы 59%, постоянные 336 000 ₽ в месяц. Эффект проверяется после внедрения.</p></div>`}
const taskDefs={hospital:{title:'Пересмотреть ночные дежурства',description:'Сравнить дежурство по вызову и текущий график стационара.',owner:'Главный врач',date:'3 октября',type:'Стационар',effect:'Убрать источник убытка',route:'finance'},surgery:{title:'Заполнить свободные часы операционной',description:'Согласовать окна вторника и четверга с хирургом.',owner:'Администратор',date:'5 октября',type:'Загрузка',effect:'Рост при той же команде',route:'efficiency'},purchase:{title:'Пересмотреть закупочные условия',description:'Сравнить цены поставщиков и расход препаратов на услугу.',owner:'Управляющий',date:'6 октября',type:'Закупки',effect:'Снизить долю затрат',route:'stock'},stock:{title:'Проверить партии с близким сроком',description:'Сверить остатки и согласовать возврат или использование.',owner:'Ответственный за склад',date:'2 октября',type:'Склад',effect:'18 000 ₽ требуют проверки',route:'stock'}};
function tasksPage(){const done=state.tasks.filter(t=>t.done).length;return head('План действий','Рекомендации, которые команда взяла в работу.',B('Добавить рекомендации','add-growth-tasks','rose'))+`<div class="grid g3"><div class="card"><span class="eyebrow">В работе</span><h2 style="margin-top:9px">${state.tasks.length-done}</h2></div><div class="card"><span class="eyebrow">Выполнено</span><h2 class="positive" style="margin-top:9px">${done}</h2></div><div class="card"><span class="eyebrow">Контроль результата</span><p class="small muted" style="margin-top:9px">По факту следующего месяца</p></div></div><div class="mt">${state.tasks.length?state.tasks.map(t=>{const d=taskDefs[t.id];return `<div class="task ${t.done?'done':''}"><input class="taskcheck" type="checkbox" data-task="${t.id}" ${t.done?'checked':''} aria-label="Выполнено: ${d.title}"><div class="task-main">${tag(t.done?'Выполнено':d.type,t.done?'green':'')}<h3>${d.title}</h3><p>${d.description}</p><div class="task-footer"><span class="tiny muted">${d.owner} · до ${d.date}</span><a class="textlink" href="#${d.route}">К данным ${ic('arrow')}</a></div></div>${B(ic('close'),'remove-task','clear sm',`data-id="${t.id}" aria-label="Убрать задачу ${d.title}"`)}</div>`}).join(''):`<div class="card empty">${ic('task')}<h2>Пока нет задач</h2><p style="margin:10px 0 20px">Откройте рекомендацию и нажмите «В план действий».</p>${B('Разобрать стационар','insight','rose','data-id="hospital"')}</div>`}</div>`}
function botAnswer(q){const t=q.toLowerCase(),m=month();if(/денег|зарплат|разрыв|плат[её]ж|хватит/.test(t))return {text:cashGap()<0?`На 2 октября не хватает ${money(-cashGap())}.\n\nСейчас ${money(currentCash())}. До зарплаты ожидается 65 000 ₽ поступлений, поставщику — 65 000 ₽, зарплаты — 460 000 ₽.\n\nПеренос поставщика на 5 октября даст запас ${money(cashGap()+65000)}.`:`На зарплату хватает.\n\nПоставщик запланирован на ${state.supplierDate.slice(-2)} октября. После зарплаты 2 октября останется ${money(cashGap())}.`,route:'payments',label:'Открыть календарь'};if(/стационар|минус|ноч|убыт/.test(t))return {text:'Стационар потерял 14 000 ₽ в сентябре.\n\nЗагрузка — 28%, ночные смены — 49 000 ₽. Эти расходы почти не зависят от числа животных.\n\nСравните дежурство по вызову с текущим графиком. За июль–сентябрь убыток составил 34 000 ₽.',action:'insight',id:'hospital',label:'Посмотреть расчёт'};if(/склад|препарат|срок/.test(t))return {text:`${money(stockRisk())} в партиях с близким сроком требуют проверки.\n\nНачните с вакцины A: 12 доз, срок до 8 октября. Проверьте остатки, возможность возврата и план использования.`,route:'stock',label:'Открыть склад'};if(/врач|хирург/.test(t))return {text:'Операционная занята на 48%. Сначала проверьте свободные часы текущей команды.\n\nУ Михаила Орлова 80 приёмов в сентябре. Выручка — 410 000 ₽; вклад после прямых затрат — 144 000 ₽.',route:'doctors',label:'Экономика врачей'};if(/рост|увелич|план|сценар/.test(t))return {text:`Сценарий «С ростом» даёт ${money(modelYear(modelData('growth')))} прибыли за 12 месяцев. Это на ${money(modelYear(modelData('growth'))-modelYear(modelData('base')))} выше базового.\n\nПредпосылки: выручка +8%, переменные расходы 59%. Проверьте загрузку операционной, ночные смены и закупки.`,route:'model',label:'Сравнить сценарии'};if(/прибыл|заработ|выруч|расход/.test(t))return {text:`${m.name}: выручка ${money(m.revenue)}, расходы ${money(m.expenses)}.\n\nЧистая прибыль — ${money(m.revenue-m.expenses)}, рентабельность — ${pct((m.revenue-m.expenses)/m.revenue*100)}.\n\nНа счетах и в кассе ${money(currentCash())}. Остаток денег и прибыль — разные показатели.`,route:'finance',label:'Разобрать прибыль'};return {text:'В демо доступны вопросы о прибыли, зарплате, стационаре, врачах, складе и плане роста. Выберите тему — покажу расчёт и следующий шаг.'}}

function assistantPage(){return head('Финансовый помощник','Спросите обычными словами. Получите цифру, причину и действие.',B('Новый диалог','clear-chat','white'))+`<div class="chat-layout"><div class="card chat-card"><div class="chat-head"><div class="brand-icon">${mark()}</div><div><strong>ВетФинанс</strong><small>${state.connections.tg?'Утренний разбор в Telegram':'Telegram не подключён'} · ${esc(state.time)}</small></div><span class="badge gray" style="margin-left:auto">Демо-диалог</span></div><div class="chat-messages" id="chat-messages" role="log" aria-live="polite">${chatMessages()}</div><form class="chat-form" id="chat-form"><input id="chat-question" aria-label="Ваш вопрос" placeholder="На зарплату денег хватит?" maxlength="500" required autocomplete="off"><button class="btn rose" aria-label="Отправить вопрос">${ic('send')}</button></form></div><div><div class="card"><div class="eyebrow">НАЧНИТЕ С ВОПРОСА</div>${['Сколько клиника заработала?','Хватит ли денег на зарплату?','Почему стационар в минусе?','Как выйти на рост?','Что со складом?'].map(q=>`<button class="question" data-action="ask" data-question="${q}">${q}</button>`).join('')}<p class="hint mt">Демо отвечает по подготовленным темам и текущему состоянию кабинета.</p></div><div class="card mt"><div class="flex">${ic('lock')}<h3>Только нужные данные</h3></div><p class="small muted" style="margin:12px 0">Для разбора используются суммы, услуги и статьи расходов.</p><p class="hint">В HTML нет подключения к банку, Telegram или внешней модели.</p></div></div></div>`}
function settings(){return head('Настройки','Клиника, источники данных и утренний разбор.',B('Подключить заново','restart-onboard','white'))+`<div class="grid g2"><div class="card"><h2>Профиль клиники</h2><form id="settings-form" style="margin-top:22px"><label class="field">Название<input name="clinic" value="${esc(state.clinic)}" required maxlength="70"></label><label class="field">Город<input name="city" value="${esc(state.city)}" required maxlength="40"></label><label class="field">Владелец<input name="owner" value="${esc(state.owner)}" required maxlength="40"></label><label class="field">Разбор по Москве<input name="time" type="time" value="${esc(state.time)}" required></label><button class="btn rose" style="margin-top:22px">Сохранить</button></form></div><div><div class="card"><h2>Источники данных</h2>${[['mis',state.mis,'Приёмы, услуги, врачи и склад'],['bank',state.bank,'Остатки и выписка'],['tg','Telegram','Утренний разбор']].map(([id,n,d])=>`<div class="source"><div class="source-logo ${id==='bank'?'bank':id==='tg'?'tg':''}">${ic(id==='mis'?'heart':id==='bank'?'wallet':'send')}</div><div class="description"><strong>${esc(n)}</strong><p>${d}</p>${tag(state.connections[id]?'Подключено':'Отключено',state.connections[id]?'green':'gray')}</div>${B(state.connections[id]?'Отключить':'Подключить','toggle-source','white sm',`data-id="${id}"`)}</div>`).join('')}<p class="hint mt">Изменения подключения имитируются. Внешние данные не передаются.</p></div><div class="card mt"><h3>Начать показ заново</h3><p class="small muted" style="margin:8px 0 16px">Вернуть платежи, задачи и расчёты к исходному примеру.</p>${B(ic('refresh')+' Сбросить демо','reset-demo','white')}</div></div></div>`}
function connectPage(){const step=state.onboard||1;let body='';if(step===1)body=`<h2>Ваша клиника</h2><p>Укажите название, которое будет в отчётах.</p><form id="onboard-profile"><label class="field">Название клиники<input name="clinic" placeholder="Например, Айболит" value="${esc(state.clinic)}" maxlength="70" required></label><div class="grid g2 mt"><label class="field">Город<input name="city" value="${esc(state.city)}" maxlength="40" required></label><label class="field" style="margin:0">Владелец<input name="owner" value="${esc(state.owner)}" maxlength="40" required></label></div><div class="form-actions">${A('В кабинет','overview','clear')}<button class="btn rose">Далее ${ic('arrow')}</button></div></form>`;if(step===2)body=`<h2>Данные для модели</h2><p>Выберите учёт и банк. Запустим демо-синхронизацию.</p><label class="field">Программа учёта<select id="onboard-mis">${['Ветменеджер','ВетАИС','VetDesk','1С:Медицина','Инфовет','Енот','Ручной учёт'].map(x=>`<option ${x===state.mis?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Банк<select id="onboard-bank">${['Т-Банк','Сбер','Альфа-Банк','ВТБ','Точка','Другой банк'].map(x=>`<option ${x===state.bank?'selected':''}>${x}</option>`).join('')}</select></label><div class="notice green mt"><div class="flex">${ic('lock')}Только чтение. Ключи доступа в демо не нужны.</div></div><div class="form-actions">${B(ic('back')+' Назад','onboard-back','white')}${B('Подключить источники '+ic('arrow'),'onboard-sync','rose')}</div>`;if(step===3)body=`<h2>Утренний разбор</h2><p>Главные цифры и действия — в одном сообщении.</p><div class="source"><div class="source-logo tg">${ic('send')}</div><div class="description"><strong>Telegram</strong><p>Демонстрационный канал владельца</p></div>${tag('Готов','green')}</div><label class="field mt">Время по Москве<input id="onboard-time" type="time" value="${esc(state.time)}" required></label><div class="form-actions">${B(ic('back')+' Назад','onboard-back','white')}${B('Собрать модель '+ic('arrow'),'onboard-finish','rose')}</div>`;if(step===4)body=`<div class="success-icon">${ic('check')}</div><h2>Всё готово</h2><p>Модель клиники «${esc(state.clinic)}» собрана.</p><div class="listrow"><span>Программа учёта</span><b>${esc(state.mis)}</b></div><div class="listrow"><span>Банк</span><b>${esc(state.bank)}</b></div><div class="listrow"><span>Утренний разбор</span><b>${esc(state.time)} · Москва</b></div><div class="form-actions">${A('Открыть кабинет '+ic('arrow'),'overview','rose full')}</div>`;return `<div class="onboard"><div class="stage">${['Клиника','Источники','Разбор'].map((n,i)=>`<b class="${step===i+1?'current':step>i+1?'done':''}"><span>${step>i+1?'✓':i+1}</span>${n}</b>`).join('')}</div><div class="onboard-layout"><div class="onboard-aside"><div class="brand-icon">${mark()}</div><h1>Понимать деньги.<br><span class="negative">Управлять клиникой.</span></h1><p>Один раз подключите источники. Дальше цифры собираются в понятную картину.</p><div class="flex tiny muted">${ic('check')} Прибыль, причины и следующий шаг</div><div class="flex tiny muted" style="margin-top:12px">${ic('check')} Всё главное — каждое утро</div><p class="hint" style="font-size:10px;margin-top:35px">Демонстрационный сценарий. Финансовые данные вымышлены.</p></div><div class="card onboard-card" id="onboard-card">${body}</div></div></div>`}
function navRender(){const tasks=state.tasks.filter(t=>!t.done).length;$('#sidebar').innerHTML=`<a class="brand" href="#overview" aria-label="ВетФинанс — рабочий стол"><span class="brand-icon">${mark()}</span><span>ВетФинанс<small>Деньги вашей клиники</small></span></a><div class="navscroll"><nav>${navItems.map(([id,name,icon,group])=>`${group?`<div class="navlabel">${group}</div>`:''}<a href="#${id}" class="navlink ${route===id?'active':''}" ${route===id?'aria-current="page"':''}>${ic(icon)}<span>${name}</span>${id==='tasks'&&tasks?`<span class="count">${tasks}</span>`:''}</a>`).join('')}</nav></div><div class="sidebar-footer"><a href="#connect" class="navlink ${route==='connect'?'active':''}">${ic('plus')}Подключение</a><a href="#settings" class="navlink ${route==='settings'?'active':''}">${ic('settings')}Настройки</a><a href="#settings" class="profile"><span class="avatar">${esc(state.owner.slice(0,1))}К</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc(state.owner)}<small>Владелец клиники</small></span></a></div>`}
const pages={overview,finance,transactions:transactionsPage,doctors:doctorsPage,services:servicesPage,efficiency,payments,stock:stockPage,model:modelPage,tasks:tasksPage,assistant:assistantPage,settings,connect:connectPage};
function render(){navRender();$('#crumb').innerHTML=`<span class="clinic-crumb">${esc(state.clinic)}</span><span class="slash">/</span><strong>${routeNames[route]}</strong>`;$('#sync-label').innerHTML=tag('<span class="dot"></span> '+(state.connections.mis&&state.connections.bank?'Данные обновлены':'Источники отключены'),state.connections.mis&&state.connections.bank?'green':'orange');$('#main').innerHTML=`<div class="print-only">ВетФинанс · ${esc(state.clinic)} · демонстрационные данные</div><div class="page-enter">${pages[route]()}</div><footer class="footnote"><span>ВетФинанс · ${esc(state.clinic)}</span><span>Демо · вымышленные данные · изменения сохраняются в этом браузере</span></footer>`;document.title=routeNames[route]+' — ВетФинанс';renderGuide();if(route==='assistant')scrollChat()}
function navigate(id){if(!pages[id])id='overview';if(currentOverlay)closeOverlay();route=id;$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open');render();window.scrollTo(0,0)}
function go(id){if(location.hash.slice(1)===id)navigate(id);else location.hash=id}
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
function toast(text){clearTimeout(toastTimer);$('#toast-host').innerHTML=`<div class="toast" role="status">${ic('check')}${esc(text)}</div>`;toastTimer=setTimeout(()=>$('#toast-host').innerHTML='',3800)}
function overlay(title,content,{drawer=false}={}){lastFocus=document.activeElement;currentOverlay=true;$('#overlay-host').innerHTML=`<div class="modal-backdrop ${drawer?'drawer-backdrop':''}" data-backdrop><section class="modal ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close-overlay" aria-label="Закрыть">${ic('close')}</button></div>${content}</section></div>`;document.body.style.overflow='hidden';$('.modal .iconbtn').focus()}
function closeOverlay(){currentOverlay=null;$('#overlay-host').innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus()}
function detail(id){const m=month();let title='',html='';if(id==='balance'){title='Деньги на счетах';html=`<div class="label">Доступный остаток · 30 сентября</div><div class="audit-number">${money(currentCash())}</div><div class="listrow"><span>${esc(state.bank)} · счёт 7972</span><b>341 300 ₽</b></div><div class="listrow"><span>Касса клиники</span><b>71 500 ₽</b></div><h3>Ближайшая выплата</h3><p>2 октября: зарплаты 460 000 ₽. Учтите поступления и расчёт с поставщиком.</p>${A('Проверить будущий остаток '+ic('arrow'),'payments','rose full')}`}
else if(id==='revenue'){title='Из чего сложилась выручка';html=`<div class="label">${m.name} 2026</div><div class="audit-number">${money(m.revenue)}</div>${deps().map(d=>`<div class="listrow"><span>${d.name}</span><b>${money(d.revenue)}</b></div>`).join('')}<p class="mt">Услуги и продажи учтены в демонстрационном месяце. Поступления показаны сводными операциями.</p>${A('Посмотреть операции '+ic('arrow'),'transactions','rose full')}`}
else if(id==='expenses'){title='Состав расходов';html=`<div class="label">${m.name} 2026</div><div class="audit-number">${money(m.expenses)}</div>${Object.entries(costs()).map(([n,v])=>`<div class="listrow"><span>${n}</span><b>${money(v)}</b></div>`).join('')}<p class="mt">Категории расходов можно уточнить в транзакциях.</p>${A('Открыть транзакции '+ic('arrow'),'transactions','rose full')}`}
else if(id==='profit'){title='Расчёт чистой прибыли';html=`<div class="label">${m.name} 2026</div><div class="audit-number positive">${money(m.revenue-m.expenses)}</div><div class="listrow"><span>Выручка</span><b>${money(m.revenue)}</b></div><div class="listrow"><span>− Расходы</span><b>${money(m.expenses)}</b></div><div class="listrow"><span>Рентабельность</span><b>${pct((m.revenue-m.expenses)/m.revenue*100)}</b></div><h3>Почему остаток другой?</h3><p>На счёте лежат деньги разных периодов. Прибыль показывает результат выбранного месяца.</p>${A('По направлениям '+ic('arrow'),'finance','rose full')}`}
else{const entries={visits:['Приёмы за месяц',month().visits+' приёмов','Завершённые приёмы из программы учёта. Стационар учтён в единицах завершённых случаев.'],load:['Загрузка врачей',pct(m.load),'Доля занятого времени в доступном расписании команды.'],average:['Средний чек',money(m.revenue/m.visits),`${money(m.revenue)} ÷ ${m.visits} приёмов. В демо продажи препаратов отнесены к связанным приёмам.`]};[title]=entries[id];html=`<div class="audit-number">${entries[id][1]}</div><p class="mt">${entries[id][2]}</p>${A('Экономика врачей '+ic('arrow'),'doctors','rose full')}`}
overlay(title,html+'<div class="source-note">Источник: программа учёта + выписка банка · демоданные</div>',{drawer:true})}
function hospitalInsight(period='sep'){const prev=state.period;state.period=period;const m=month(),hospital=deps()[3];state.period=prev;overlay('Почему стационар в минусе',`<div class="label">${m.name} · стационар</div><div class="audit-number negative">${money(hospital.profit)}</div><p>${period==='sep'?'Убыток третий месяц: −9 000 ₽ → −11 000 ₽ → −14 000 ₽.':'Отрицательный результат выбранного месяца.'}</p><div class="factgrid"><div class="fact"><small>Загрузка</small><strong>28%</strong></div><div class="fact"><small>Ночные смены</small><strong>49 000 ₽</strong></div></div><h3>Из чего сложился результат</h3><div class="listrow"><span>Выручка</span><b>${money(hospital.revenue)}</b></div><div class="listrow"><span>Ночные смены</span><b>49 000 ₽</b></div><div class="listrow"><span>Препараты и дневной уход</span><b>${money(hospital.cost-49000-22000)}</b></div><div class="listrow"><span>Аренда и общие затраты</span><b>22 000 ₽</b></div><h3>Что сделать</h3><p>Согласовать дежурство по вызову или проверить цену суток 3 100 ₽ вместо 2 400 ₽. Условие — сохранить нужный уровень ухода.</p><div class="notice mt"><b>За квартал потеряно 34 000 ₽</b><p>Цель — убрать убыток. Эффект зависит от графика и загрузки.</p></div><div class="grid mt">${B(state.tasks.some(t=>t.id==='hospital')?'Уже в плане действий':'В план действий','add-task','rose','data-id="hospital"')}${A('Проверить финансовую модель '+ic('arrow'),'model','white')}</div><div class="source-note">Госпитализации, ведомость зарплат, распределение аренды.</div>`,{drawer:true})}
function department(id){const d=deps()[Number(id)];if(!d)return;if(d.id===3){hospitalInsight(state.period);return}overlay(d.name,`<div class="label">${month().name} · результат направления</div><div class="audit-number positive">${money(d.profit)}</div><div class="listrow"><span>Выручка</span><b>${money(d.revenue)}</b></div><div class="listrow"><span>Прямые и общие расходы</span><b>${money(d.cost)}</b></div><div class="listrow"><span>Рентабельность</span><b>${pct(d.profit/d.revenue*100)}</b></div><h3>Что проверить</h3><p>${['Сопоставьте загрузку терапевтов и число повторных приёмов.','Есть свободные часы операционной. Проверьте плановые операции.','Сверьте затраты внешних лабораторий и загрузку оборудования.','','Сверьте закупочные цены и сроки годности.'][d.id]}</p><div class="grid mt">${A('Экономика услуг '+ic('arrow'),'services','rose')}${A('Экономика врачей','doctors','white')}</div>`,{drawer:true})}
function transactionDetail(id){const t=transactions().find(x=>x.id===id);if(!t)return;overlay('Операция',`<span class="label">${t.date.split('-').reverse().join('.')} · ${esc(t.source)}</span><div class="audit-number ${t.amount>0?'positive':''}">${t.amount>0?'+':''}${money(t.amount)}</div><h3>${t.name}</h3><p>Сводная запись из демонстрационной выписки.</p>${t.amount<0?`<form id="category-form" data-id="${t.id}" class="mt"><label class="field">Статья расхода<select name="category">${expenseNames.map(n=>`<option ${n===t.cat?'selected':''}>${n}</option>`).join('')}</select></label><p class="hint mt">Изменится структура расходов. Общая сумма останется прежней.</p><button class="btn rose full mt">Сохранить категорию</button></form>`:`<div class="listrow"><span>Категория</span><b>Выручка</b></div>${A('К отчёту о прибыли','finance','rose full')}`}`,{drawer:true})}
function doctorDetail(id){const d=docData(doctors[Number(id)]);overlay(d.name,`${tag(d.role,'gray')}<h3>Прямой вклад за ${month().name.toLowerCase()}</h3><div class="audit-number positive">${money(d.revenue-d.pay-d.other)}</div><div class="listrow"><span>Выручка</span><b>${money(d.revenue)}</b></div><div class="listrow"><span>Оплата труда</span><b>${money(d.pay)}</b></div><div class="listrow"><span>Материалы и лаборатория</span><b>${money(d.other)}</b></div><div class="factgrid"><div class="fact"><small>Приёмов</small><strong>${d.visits}</strong></div><div class="fact"><small>Средний чек</small><strong>${money(d.revenue/d.visits)}</strong></div></div><h3>Загрузка ${d.load}%</h3><p>${d.load<55?'Есть свободное время. Проверьте расписание и поток пациентов перед наймом.':'Сопоставьте расписание и поток повторных приёмов.'}</p>${A('Проверить кабинеты '+ic('arrow'),'efficiency','rose full')}<div class="source-note">Расчёт до общих расходов клиники. Источник: приёмы, зарплаты, материалы.</div>`,{drawer:true})}
function serviceDetail(id){const s=services[Number(id)];overlay(s.name,`${tag(s.cat,'gray')}<h3>Прямой вклад услуги</h3><div class="audit-number positive">${money(s.price-s.direct)}</div><div class="listrow"><span>Цена</span><b>${money(s.price)}</b></div><div class="listrow"><span>Прямые затраты</span><b>${money(s.direct)}</b></div><h3>Проверить другую цену</h3><label class="field">Цена, ₽<input type="number" id="service-price" min="1" max="1000000" step="1" value="${s.price}" data-id="${s.id}"></label><div class="notice mt" id="service-result">Вклад: ${money(s.price-s.direct)} · ${pct((s.price-s.direct)/s.price*100)} от цены</div><p class="hint mt">Проверка не меняет прайс. Постоянные расходы оцениваются отдельно.</p>${s.id===4?B('Почему направление убыточно?','insight','soft full','data-id="hospital" style="margin-top:20px"'):A('К финансовой модели '+ic('arrow'),'model','rose full')}`,{drawer:true})}
function stockDetail(id){const s=stock[Number(id)],done=state.stockDone.includes(s.id);overlay(s.name,`${tag(done?'Проверено':s.days<=30?'Близкий срок':'В норме',done?'green':s.days<=30?'orange':'green')}<div class="audit-number">${money(s.cost)}</div><div class="listrow"><span>Партия</span><b>${s.batch}</b></div><div class="listrow"><span>Остаток</span><b>${s.qty} ${s.unit}</b></div><div class="listrow"><span>Годен до</span><b>${s.expiry.split('-').reverse().join('.')}</b></div><h3>Следующее действие</h3><p>Сверьте фактический остаток. Уточните у поставщика возможность возврата и согласуйте использование с врачом.</p><div class="grid mt">${B(done?'Вернуть на проверку':'Отметить как проверено','stock-check','rose',`data-id="${s.id}"`)}${B('Поставить задачу складу','add-task','white','data-id="stock"')}</div><div class="source-note">Отметка фиксирует проверку. Сумма остатка и прибыль не меняются.</div>`,{drawer:true})}
function paymentDetail(id){const p=paymentItems().find(x=>x.id===id);if(!p)return;overlay(p.name,`<div class="audit-number">${money(p.amount)}</div><div class="listrow"><span>Статья</span><b>${p.type}</b></div>${id==='supplier'?`<form id="supplier-form" class="mt"><label class="field">Дата в плане<input name="date" type="date" value="${state.supplierDate}" min="2026-10-01" max="2026-10-07" required></label><p class="hint mt">Согласуйте перенос с поставщиком. В демо дата меняется только в плане.</p><button class="btn rose full mt">Сохранить дату</button></form>`:`<div class="listrow"><span>Дата</span><b>${p.date.split('-').reverse().join('.')}</b></div><div class="notice mt">Это плановый платёж. Деньги не списываются.</div>${p.id.startsWith('new-')?B('Убрать из плана','delete-payment','white full',`data-id="${p.id}" style="margin-top:20px"`):''}`}`,{drawer:true})}
function addPayment(){overlay('Новый плановый платёж',`<form id="payment-form"><label class="field">Назначение<input name="name" required maxlength="80" placeholder="Например, обслуживание оборудования"></label><div class="grid g2 mt"><label class="field">Сумма, ₽<input name="amount" type="number" min="1" max="5000000" step="1" required placeholder="25 000"></label><label class="field" style="margin:0">Дата<input name="date" type="date" value="2026-10-05" min="2026-10-01" max="2026-10-07" required></label></div><p class="hint mt">Платёж попадёт в прогноз на 1–7 октября.</p><button class="btn rose full mt">Добавить в план</button></form>`)}
function quarterDetail(id){const d=modelData()[Number(id)];overlay(d.label,`<div class="label">Прогноз · ${esc({base:'Базовый',growth:'С ростом',cautious:'Осторожный',custom:'Свой сценарий'}[state.scenario])}</div><div class="audit-number positive">${money(d.profit)}</div><p>Чистая прибыль за квартал.</p>${[['Выручка',d.revenue],['Переменные расходы',-d.variable],['Постоянные расходы',-d.fixed],['Налоги',-d.tax]].map(([n,v])=>`<div class="listrow"><span>${n}</span><b>${money(v)}</b></div>`).join('')}<div class="notice green mt">Рентабельность ${pct(d.margin)}</div><div class="source-note">Налоги в демо: условные 3% выручки. Модель иллюстративная, без привязки к режиму налогообложения.</div>`,{drawer:true})}
const guideSteps=[{route:'overview',title:'Вся клиника на одном экране',text:'Нажмите на выручку или прибыль: каждая цифра раскрывается до состава.'},{route:'finance',title:'От цифры к причине',text:'Откройте стационар. Посмотрите причину убытка и добавьте действие в план.'},{route:'payments',title:'Закройте кассовый разрыв',text:'Перенесите 65 000 ₽ поставщику. График и остаток пересчитаются.'},{route:'model',title:'Проверьте рост',text:'Сравните сценарии. В своём сценарии измените выручку и расходы.'},{route:'assistant',title:'Вопрос вместо таблицы',text:'Спросите, хватит ли на зарплату. Ответ уже учитывает перенос платежа.'},{route:'tasks',title:'Доведите решение до действия',text:'Проверьте список задач и отметьте выполненное. Демо завершено.'}];
function renderGuide(){const n=state.guide;if(n===null||n===undefined){$('#guide-host').innerHTML='';return}const g=guideSteps[n];$('#guide-host').innerHTML=`<aside class="demo-guide" aria-label="Маршрут демонстрации"><div class="row"><span class="eyebrow">ДЕМО · ${n+1} / ${guideSteps.length}</span><button class="iconbtn" data-action="guide-close" aria-label="Скрыть маршрут">${ic('close')}</button></div><h3>${g.title}</h3><p>${g.text}</p><div class="row"><div class="guide-dots">${guideSteps.map((x,i)=>`<i class="${i===n?'active':''}"></i>`).join('')}</div><div class="flex">${n?B(ic('back'),'guide-prev','white sm','aria-label="Предыдущий шаг"'):''}${B(n===guideSteps.length-1?'Готово':'Далее '+ic('arrow'),'guide-next','rose sm')}</div></div></aside>`}
function addTask(id){if(!taskDefs[id])return;if(!state.tasks.some(t=>t.id===id))state.tasks.push({id,done:false});save();navRender()}
function csvDownload(name,rows){const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Отчёт подготовлен для скачивания')}
function exportData(type){if(type==='transactions'){const list=transactions().filter(t=>(txFilter==='all'||(txFilter==='in'?t.amount>0:t.amount<0))&&(t.name+' '+t.cat+' '+t.source).toLowerCase().includes(txSearch.toLowerCase()));csvDownload('ВетФинанс-операции-'+month().date,[['Дата','Операция','Источник','Статья','Сумма'],...list.map(t=>[t.date,t.name,t.source,t.cat,t.amount])])}else if(type==='finance')csvDownload('ВетФинанс-прибыль-'+month().date,[['Направление','Выручка','Расходы','Прибыль'],...deps().map(d=>[d.name,d.revenue,d.cost,d.profit]),['Итого',month().revenue,month().expenses,month().revenue-month().expenses]]);else if(type==='model')csvDownload('ВетФинанс-прогноз-'+state.scenario,[['Квартал','Выручка','Переменные расходы','Постоянные расходы','Налоги','Прибыль','Рентабельность %'],...modelData().map(x=>[x.label,x.revenue,x.variable,x.fixed,x.tax,x.profit,x.margin.toFixed(2)])]);else csvDownload('ВетФинанс-склад',[['Позиция','Партия','Количество','Срок годности','Стоимость','Проверено'],...stock.map(x=>[x.name,x.batch,x.qty,x.expiry,x.cost,state.stockDone.includes(x.id)?'Да':'Нет'])])}
function scrollChat(){const box=$('#chat-messages');if(box)box.scrollTop=box.scrollHeight}
function ask(q){q=q.trim().slice(0,500);if(!q)return;state.chat.push({role:'user',text:q},{role:'assistant',question:q});state.chat=state.chat.slice(-30);save();if(route!=='assistant')go('assistant');else{$('#chat-messages').innerHTML=chatMessages();$('#chat-question').value='';scrollChat();$('#chat-question').focus()}}
function startSync(){state.mis=$('#onboard-mis').value;state.bank=$('#onboard-bank').value;connectBusy=true;$('#onboard-card').innerHTML=`<div class="eyebrow">СОБИРАЕМ ДАННЫЕ</div><h2 style="margin-top:15px">Подключаем источники</h2><p>Показываем путь первичной настройки.</p><div class="progress-line"><i id="sync-progress"></i></div><div id="sync-status" class="small muted">Приёмы и услуги…</div>`;const statuses=['Приёмы и услуги…','Платежи и остатки…','Статьи расходов…','Источники готовы'];let i=0;const timer=setInterval(()=>{if(route!=='connect'){clearInterval(timer);connectBusy=false;return}const bar=$('#sync-progress'),label=$('#sync-status');if(!bar){clearInterval(timer);connectBusy=false;return}bar.style.width=(i+1)*25+'%';label.textContent=statuses[i];i++;if(i===4){clearInterval(timer);connectBusy=false;state.connections.mis=true;state.connections.bank=true;state.onboard=3;save();setTimeout(()=>{if(route==='connect')render()},250)}},280)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(e.target.hasAttribute('data-backdrop')){closeOverlay();return}if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(b.disabled)return;
if(a==='detail')detail(id);else if(a==='insight')hospitalInsight();else if(a==='department')department(id);else if(a==='transaction')transactionDetail(id);else if(a==='doctor')doctorDetail(id);else if(a==='service')serviceDetail(id);else if(a==='stock-detail')stockDetail(id);else if(a==='payment')paymentDetail(id);else if(a==='quarter')quarterDetail(id);else if(a==='close-overlay')closeOverlay();else if(a==='mobile-menu'){$('#sidebar').classList.toggle('open');$('#mobile-shade').classList.toggle('open')}else if(a==='tx-filter'){txFilter=id;render()}else if(a==='stock-filter'){stockFilter=id;render()}else if(a==='scenario'){state.scenario=id;save();render()}else if(a==='move-supplier'){overlay('Перенести платёж?',`<p class="small muted">ВетСнаб · 65 000 ₽</p><div class="listrow"><span>Было</span><b>1 октября</b></div><div class="listrow"><span>Новая дата</span><b>5 октября</b></div><div class="notice green mt">Остаток после зарплаты: ${money(cashGap()+65000)}.</div><p class="hint mt">Перенос показан в плане. Внешних платежей нет.</p><div class="form-actions">${B('Отмена','close-overlay','white')}${B('Подтвердить перенос','confirm-move','rose')}</div>`)}else if(a==='confirm-move'){state.supplierDate='2026-10-05';save();closeOverlay();render();toast('Платёж перенесён. Прогноз обновлён')}else if(a==='undo-supplier'){state.supplierDate='2026-10-01';save();render();toast('Исходная дата восстановлена')}else if(a==='add-payment')addPayment();else if(a==='delete-payment'){state.extraPayments=(state.extraPayments||[]).filter(p=>p.id!==id);save();closeOverlay();render();toast('Платёж убран из плана')}else if(a==='stock-check'){const i=Number(id);state.stockDone=state.stockDone.includes(i)?state.stockDone.filter(x=>x!==i):[...state.stockDone,i];save();closeOverlay();render();toast('Статус проверки обновлён')}else if(a==='add-task'){addTask(id);closeOverlay();if(route==='tasks')render();toast('Задача в плане действий')}else if(a==='add-growth-tasks'){['hospital','surgery','purchase'].forEach(addTask);if(route==='tasks')render();toast('Три рекомендации добавлены в план')}else if(a==='remove-task'){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('Задача убрана из плана')}else if(a==='ask')ask(b.dataset.question);else if(a==='clear-chat'){state.chat=[];save();render();toast('Диалог очищен')}else if(a.startsWith('export-'))exportData(a.slice(7));else if(a==='print')window.print();else if(a==='toggle-source'){state.connections[id]=!state.connections[id];save();render();toast(state.connections[id]?'Источник подключён в демо':'Источник отключён. Показаны последние данные')}else if(a==='restart-onboard'){state.onboard=1;save();go('connect')}else if(a==='onboard-back'){state.onboard=Math.max(1,state.onboard-1);save();render()}else if(a==='onboard-sync'){if(!connectBusy)startSync()}else if(a==='onboard-finish'){if(!$('#onboard-time').reportValidity())return;state.time=$('#onboard-time').value;state.connections.tg=true;state.onboard=4;save();render()}else if(a==='reset-demo'){overlay('Начать демо заново?',`<p class="small muted">Вернутся исходная клиника, платёжный план, настройки и примеры. Ваши действия в этом демо будут очищены.</p><div class="form-actions">${B('Отмена','close-overlay','white')}${B('Сбросить демо','confirm-reset','rose')}</div>`)}else if(a==='confirm-reset'){state=defaultState();save();txFilter='all';txSearch='';docSearch='';stockFilter='all';serviceType='all';closeOverlay();go('overview');toast('Демо возвращено к началу')}else if(a==='guide-start'){state.guide=0;save();go('overview');renderGuide()}else if(a==='guide-close'){state.guide=null;save();renderGuide()}else if(a==='guide-next'||a==='guide-prev'){const n=state.guide+(a==='guide-next'?1:-1);state.guide=n>=guideSteps.length?null:Math.max(0,n);save();if(state.guide!==null)go(guideSteps[state.guide].route);renderGuide()}
});
document.addEventListener('submit',e=>{const f=e.target;if(!['settings-form','onboard-profile','category-form','supplier-form','payment-form','chat-form'].includes(f.id))return;e.preventDefault();if(!f.reportValidity())return;const data=new FormData(f);if(f.id==='settings-form'||f.id==='onboard-profile'){for(const key of ['clinic','city','owner']){const v=String(data.get(key)||'').trim();if(!v){f.elements[key].setCustomValidity('Заполните поле');f.elements[key].reportValidity();f.elements[key].addEventListener('input',()=>f.elements[key].setCustomValidity(''),{once:true});return}state[key]=v}if(f.id==='settings-form')state.time=data.get('time');else state.onboard=2;save();render();if(f.id==='settings-form')toast('Настройки сохранены')}else if(f.id==='category-form'){state.categories[f.dataset.id]=data.get('category');save();closeOverlay();render();toast('Категория обновлена в отчёте')}else if(f.id==='supplier-form'){state.supplierDate=data.get('date');save();closeOverlay();render();toast('Дата платежа и прогноз обновлены')}else if(f.id==='payment-form'){const name=String(data.get('name')).trim();if(!name){f.elements.name.setCustomValidity('Укажите назначение');f.elements.name.reportValidity();f.elements.name.oninput=()=>f.elements.name.setCustomValidity('');return}state.extraPayments=state.extraPayments||[];state.extraPayments.push({id:'new-'+Date.now(),name,date:data.get('date'),amount:Number(data.get('amount')),type:'Прочее'});save();closeOverlay();render();toast('Платёж добавлен в прогноз')}else if(f.id==='chat-form')ask($('#chat-question').value)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='period'){state.period=t.value;save();render()}else if(t.id==='service-type'){serviceType=t.value;$('#service-rows').innerHTML=serviceRows()}else if(t.dataset.task){const task=state.tasks.find(x=>x.id===t.dataset.task);if(task)task.done=t.checked;save();render();toast(t.checked?'Задача отмечена выполненной':'Задача возвращена в работу')}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='tx-search'){txSearch=t.value;$('#tx-rows').innerHTML=txRows()}else if(t.id==='doctor-search'){docSearch=t.value;$('#doctor-rows').innerHTML=doctorRows()}else if(t.id.startsWith('custom-')){const key=t.id.slice(7);state.custom[key]=Number(t.value);save();$('#'+key+'-value').textContent=key==='fixed'?money(state.custom[key]):state.custom[key]+'%';$('#model-result').innerHTML=modelResult()}else if(t.id==='service-price'){const value=Number(t.value),s=services[Number(t.dataset.id)];$('#service-result').textContent=value>0&&value<=1000000?`Вклад: ${money(value-s.direct)} · ${pct((value-s.direct)/value*100)} от цены`:'Введите цену от 1 до 1 000 000 ₽';$('#service-result').classList.toggle('green',value>s.direct)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(currentOverlay)closeOverlay();$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open')}if(e.key==='Tab'&&currentOverlay){const els=$$('.modal button,.modal a[href],.modal input,.modal select,.modal textarea').filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#mobile-shade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open')});
navigate(location.hash.slice(1)||'overview');
</script>
