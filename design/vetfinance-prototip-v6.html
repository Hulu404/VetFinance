<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВетФинанс, прототип v6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cg fill=%27%23B8174F%27%3E%3Ccircle cx=%275%27 cy=%276.6%27 r=%272.35%27/%3E%3Ccircle cx=%2712%27 cy=%273.3%27 r=%272.35%27/%3E%3Ccircle cx=%2719%27 cy=%275.4%27 r=%272.35%27/%3E%3Crect x=%272.75%27 y=%2710.4%27 width=%274.5%27 height=%2710.6%27 rx=%272.25%27/%3E%3Crect x=%279.75%27 y=%277.1%27 width=%274.5%27 height=%2713.9%27 rx=%272.25%27/%3E%3Crect x=%2716.75%27 y=%279.2%27 width=%274.5%27 height=%2711.8%27 rx=%272.25%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#B8174F; --accent-dark:#8A0F3A; --accent-soft:#F8E1E9; --accent-soft2:#FCF1F5; --accent-mid:#D6567F; --accent-light:#E9A3BB;
  --ink:#15141B; --ink-soft:#6C6B78; --ink-faint:#A7A5B2;
  --bg-soft:#F7F6F9; --sidebar:#15131C; --border:#EDEAF2;
  --ok:#12875E; --ok-soft:#E1F6ED; --warn:#A6690A; --warn-soft:#FDF0D9;
  --bad:#C23A22; --bad-soft:#FCEBE7; --vm:#2563EB; --vm-soft:#E7EFFE;
  --r:20px; --sh:0 1px 2px rgba(20,10,25,.04),0 10px 30px -16px rgba(20,10,25,.14);
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;font-family:'Onest',ui-sans-serif,-apple-system,sans-serif;color:var(--ink);background:var(--bg-soft);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em} p{margin:0} button{font-family:inherit}
::selection{background:var(--accent-soft);color:var(--accent-dark)}
:focus-visible{outline:2.5px solid var(--accent-dark);outline-offset:2px;border-radius:8px}
.i{width:1em;height:1em;flex-shrink:0;vertical-align:-.18em;fill:none}
.i .base{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i .pop{fill:var(--accent);stroke:none} .i .popl{fill:var(--accent);opacity:.26;stroke:none}
.i .cut{fill:#fff;stroke:none} .i .cutl{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;padding:20px 13px;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:11px;padding:2px 5px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent-soft2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.brand-name{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.brand-name em{display:block;font-style:normal;font-size:11px;font-weight:500;color:#8C89A0}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;background:none;border:0;cursor:pointer;color:#BCBAC7;font-size:13.5px;font-weight:600;transition:.16s var(--ease)}
.nav button .i{font-size:19px;opacity:.9}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:rgba(255,255,255,.11);color:#fff}
.nav .arw{margin-left:auto;font-size:11px;opacity:.55;transition:transform .18s var(--ease)}
.nav button.exp .arw{transform:rotate(90deg)}
.nav .sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px}
.nav .sub button{padding:8px 12px 8px 43px;font-size:13px;font-weight:500;color:#9C99AB}
.nav .sub button.active{background:rgba(255,255,255,.09);color:#fff;font-weight:600}
.nav .sep{height:1px;background:rgba(255,255,255,.09);margin:9px 12px}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.sfoot .av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sfoot b{font-size:13px;font-weight:600;display:block;line-height:1.25}
.sfoot em{font-style:normal;font-size:11px;color:#8C89A0}

.main{flex:1;min-width:0;padding:24px 34px 64px;max-width:1280px}
.view{animation:vin .28s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:800}
.head .sub{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.bal{text-align:right} .bal .v{font-size:19px;font-weight:800}
.bal .l{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px}
.klabel{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.up{color:var(--ok)} .down{color:var(--bad)} .faint{color:var(--ink-faint)}
.note{font-size:12.5px;color:var(--ink-faint);line-height:1.55;margin-top:13px}

.hero{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:26px 28px 0;margin-bottom:16px;overflow:hidden}
.hero .lbl{font-size:13px;color:var(--ink-soft)}
.hero .num{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:4px 0 2px}
.hero .d{font-size:13.5px;font-weight:600;color:var(--ok)}
.hero svg.chart{display:block;width:100%;height:104px;margin-top:12px}

.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.acc{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:default;transition:.18s var(--ease)}
.acc:hover{transform:translateY(-2px)}
.acc .em{font-size:29px;line-height:1}
.acc .t{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase}
.acc .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.acc.hi{background:linear-gradient(135deg,var(--accent),#8A0F3A);border-color:transparent;color:#fff}
.acc.hi .t{color:rgba(255,255,255,.72)}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:20px;display:flex;align-items:flex-start;gap:13px;transition:.18s var(--ease)}
.mcard:hover{transform:translateY(-2px)}
.mcard .em{font-size:25px;line-height:1}
.mcard .t{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase}
.mcard .v{font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:3px}
.mcard .s{font-size:12.5px;font-weight:600;margin-top:4px}

.tip-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;margin-bottom:11px}
.tip-card.al{border-left:3px solid var(--accent)} .tip-card.wr{border-left:3px solid var(--warn)} .tip-card.gd{border-left:3px solid var(--ok)}
.tip-h{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tip-em{font-size:22px;line-height:1.2}
.tip-b h3{font-size:16px;font-weight:700;margin-bottom:3px}
.tip-b p{font-size:13.5px;color:var(--ink-soft);max-width:66ch}
.why{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--accent-dark);cursor:pointer;white-space:nowrap}
.why:hover{background:var(--accent-soft2);border-color:var(--accent-soft)}
.why.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ans{margin-top:15px;padding:16px 18px;background:var(--accent-soft2);border-radius:14px;font-size:14px;line-height:1.65;animation:vin .25s var(--ease)}
.ans .who{display:flex;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:9px}
.ans ol{margin:8px 0 0;padding-left:20px} .ans li{margin-bottom:5px}
.ans .src{margin-top:10px;font-size:11.5px;color:var(--ink-faint)}

.ask{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;margin-bottom:16px}
.ask-t{display:flex;align-items:center;gap:12px}
.ask-av{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:19px}
.ask-in{flex:1;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:11px 15px;color:var(--ink-faint);font-size:14px}
.qs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.qb{background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.qb:hover{border-color:var(--accent);color:var(--accent-dark)} .qb.on{background:var(--accent);border-color:var(--accent);color:#fff}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;color:var(--ink-faint);font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:0 10px 12px}
th:first-child{padding-left:0} th.r,td.r{text-align:right} td:last-child,th:last-child{padding-right:0}
td{padding:13px 10px;border-top:1px solid var(--border);font-size:14.5px}
td:first-child{padding-left:0} td.r{font-weight:600;white-space:nowrap}
.meta{font-size:12px;color:var(--ink-faint);margin-top:2px}
tr[data-tip]{cursor:help;transition:background .14s} tr[data-tip]:hover{background:var(--accent-soft2)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.red{background:var(--bad-soft);color:var(--bad)} .pill.grn{background:var(--ok-soft);color:var(--ok)}
.pill.vm{background:var(--vm-soft);color:var(--vm)} .pill.gr{background:#F0EEF4;color:var(--ink-soft)}
.pill.tg{background:#E4F1FB;color:#1B6CA8}

.pl{display:grid;grid-template-columns:1fr 160px 68px;gap:12px;align-items:center;padding:13px 14px;border-radius:11px;font-size:14.5px;cursor:help;transition:.14s}
.pl:hover{background:var(--accent-soft2)}
.pl .bar{border-left:3px solid var(--ink-faint);padding-left:11px}
.pl.rev .bar{border-color:var(--ok)} .pl.exp .bar{border-color:var(--bad)} .pl.sum .bar{border-color:var(--accent)}
.pl.sum{background:var(--accent-soft2);font-weight:700} .pl.tot{background:var(--ok-soft);font-weight:700}
.pl .n{text-align:right;font-weight:700} .pl .p{text-align:right;font-size:12.5px;color:var(--ink-faint);font-weight:600}

.bars{display:flex;flex-direction:column;gap:14px}
.brow{cursor:help;padding:3px 0}
.b-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.b-top b{font-weight:600} .b-top span{color:var(--ink-soft)}
.track{height:10px;background:#F0EEF4;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.fill.l{background:#E9A3BB} .fill.n{background:var(--bad)} .fill.g{background:var(--ok)} .fill.d{background:var(--sidebar)}

.gauge{position:relative;height:24px;background:#F0EEF4;border-radius:7px;overflow:hidden}
.gz{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.gm{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);border-radius:2px}
.gm.bad{background:var(--bad)} .gm.warn{background:var(--warn)}

.seg{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.seg button.on{background:var(--sidebar);border-color:var(--sidebar);color:#fff}
.seg button .cnt{display:inline-block;margin-left:6px;font-size:11px;color:var(--accent);font-weight:800}
.seg button.on .cnt{color:#F29BB8}

.stack{display:flex;height:38px;border-radius:11px;overflow:hidden;margin-bottom:14px}
.stack div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;cursor:help}
.legend{display:flex;flex-wrap:wrap;gap:9px 20px;font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

.act{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.act.pri{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.act.grn{background:var(--ok);border-color:var(--ok);color:#fff}
.act.rd{background:var(--bad);border-color:var(--bad);color:#fff}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--border);font-size:14px;flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:9px}
.dot.off{background:var(--ink-faint)}
.inp{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600}
.field{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.field:first-of-type{border-top:0}
.tgl{width:42px;height:24px;border-radius:12px;background:var(--ok);position:relative;justify-self:end}
.tgl::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.tgl.off{background:#D8D3E2} .tgl.off::after{right:21px}

/* настройки: внутреннее меню */
.setwrap{display:grid;grid-template-columns:212px 1fr;gap:16px}
.setnav{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:10px;height:fit-content}
.setnav .h{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;padding:10px 12px 5px}
.setnav button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.setnav button:hover{background:var(--bg-soft)}
.setnav button.on{background:var(--accent-soft2);color:var(--accent-dark)}

/* платёжный календарь — новая версия */
.flow{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px;margin-bottom:16px}
.flow svg{display:block;width:100%;height:210px}
.daylist .d{display:grid;grid-template-columns:104px 1fr 150px 140px;gap:14px;align-items:center;padding:14px 12px;border-radius:12px;font-size:14px;cursor:help;transition:.14s}
.daylist .d:hover{background:var(--accent-soft2)}
.daylist .d.bad{background:var(--bad-soft)}
.daylist .d.bad:hover{background:#F8DAD3}
.daylist .dt{font-weight:700} .daylist .dt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);font-weight:500}
.daylist .amt{text-align:right;font-weight:600;white-space:nowrap} .daylist .rest{text-align:right;font-weight:700}

/* платёжный календарь: вид «календарь» */
.mcard .v.cv{font-size:20px;white-space:nowrap}
@media (max-width:820px){.mrow.calm{grid-template-columns:1fr}}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:2px 4px 14px}
.calbar b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.calbar .lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.calbar .li{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.li.in{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)} .li.pay{background:var(--accent)} .li.bd{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.cal{min-width:860px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border);border-radius:14px;overflow:hidden}
.cal .wh{padding:9px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg-soft)}
.cal .c{min-height:138px;padding:7px 7px 9px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px;background:#fff;min-width:0;transition:background .14s}
.cal .c.wk{background:#FBFAFC}
.cal .c.out{background:#F9F8FA} .cal .c.out .n{color:#C9C5D2}
.cal .c.past .n{color:var(--ink-faint)}
.cal .c[data-cd]{cursor:pointer}
.cal .c[data-cd]:hover{background:var(--accent-soft2)}
.cal .c.bad,.cal .c.bad:hover{background:var(--bad-soft)}
.cal .c.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .n{font-size:12.5px;font-weight:600;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;margin-bottom:1px}
.cal .c.today .n{background:var(--accent);color:#fff}
.cal .ev{font-size:11.5px;line-height:1.3;padding:3px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.in{background:var(--ok-soft);color:var(--ok);font-weight:600}
.cal .ev.pay{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:3px 6px 6px 3px}
.cal .ev.pay b{display:block;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.cal .ev.pay span{font-weight:700;color:var(--accent-dark)}
.cal .ev.more{color:var(--ink-soft);font-weight:600;padding:1px 7px}
.cal .cbal{margin-top:auto;font-size:11px;color:var(--ink-faint);padding:4px 2px 0}
.cal .cbal b{display:block;font-size:13px;color:var(--ink);font-weight:700;white-space:nowrap}
.cal .c.bad .cbal b{color:var(--bad)}
.dayp h3{font-size:19px;font-weight:700;margin-bottom:12px}
.dayp table{width:100%;border-collapse:collapse;font-size:14px}
.dayp td{padding:9px 2px;border-bottom:1px solid var(--border)}
.dayp td.r{text-align:right;font-weight:600;white-space:nowrap}
.dayp tr.tot td{font-weight:700;border-bottom:0;padding-top:12px}
.dayp.bad{border-left:3px solid var(--bad)}
.warnline{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:600}
@media (prefers-reduced-motion:reduce){.view{animation:none}.cal .c{transition:none}}

#tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .16s var(--ease),transform .16s var(--ease);
  background:#15131C;color:#fff;border-radius:15px;padding:15px 17px;max-width:335px;box-shadow:0 20px 48px -14px rgba(10,4,16,.55);font-size:13px;line-height:1.55}
#tip.on{opacity:1;transform:translateY(0)}
#tip h4{font-size:13.5px;font-weight:700;margin-bottom:9px}
#tip .r{display:flex;justify-content:space-between;gap:18px;padding:4px 0}
#tip .r span{color:#9C99AB} #tip .r b{font-weight:600}
#tip .hr{height:1px;background:rgba(255,255,255,.12);margin:9px 0}
#tip .f{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);color:#C9C6D6;font-size:12.5px}

function drawNav(){
 document.getElementById('nav').innerHTML=NAV.map(x=>{
  if(x[0]==='sep') return '<div class="sep"></div>';
  if(x[0]==='G'){
   const exp=x[3].some(s=>s[0]===view);
   return `<button class="${exp?'exp':''}" data-g="${x[2]}">${ic(x[1])}${x[2]}<span class="arw">▸</span></button>`
    + (exp?`<div class="sub">${x[3].map(s=>`<button data-v="${s[0]}" class="${s[0]===view?'active':''}">${s[1]}</button>`).join('')}</div>`:'');
  }
  return `<button data-v="${x[0]}" class="${x[0]===view?'active':''}">${ic(x[1])}${x[2]}</button>`;
 }).join('');
 document.querySelectorAll('#nav button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;open1=null;drawNav();draw();});
 document.querySelectorAll('#nav button[data-g]').forEach(b=>b.onclick=()=>{

  if(!g[3].some(s=>s[0]===view)){view=g[3][0][0];open1=null;drawNav();draw();}
 });

function draw(){
 const m=document.getElementById('main');
 m.innerHTML=`<div class="view">${(V[view]||vDash)()}</div>`;
 window.scrollTo(0,0);
 m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{open1=open1===b.dataset.q?null:b.dataset.q;draw();});
 m.querySelectorAll('[data-om]').forEach(b=>b.onclick=()=>{opiuMode=b.dataset.om;draw();});
 m.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{txTab=b.dataset.tx;draw();});
 m.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scen=b.dataset.sc;open1=null;draw();});
 m.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{setTab=b.dataset.set;draw();});

 m.querySelectorAll('[data-cd]').forEach(b=>{const go=()=>{calSel=+b.dataset.cd;const y=window.scrollY;draw();window.scrollTo(0,y);};
  b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
}
const tipEl=document.getElementById('tip'); let cur=null;
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;
 const k=el.dataset.tip;if(!T[k])return;cur=el;tipEl.innerHTML=T[k];tipEl.classList.add('on');place(e);});
document.addEventListener('mousemove',e=>{if(cur)place(e);});
document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(el&&el===cur){cur=null;tipEl.classList.remove('on');}});
function place(e){const r=tipEl.getBoundingClientRect();let x=e.clientX+18,y=e.clientY+18;
 if(x+r.width>innerWidth-14)x=e.clientX-r.width-18;
 if(y+r.height>innerHeight-14)y=Math.max(14,e.clientY-r.height-18);
 tipEl.style.left=x+'px';tipEl.style.top=y+'px';}

drawNav(); draw();
