<!--
  Прототип v7 (design/vetfinance-prototip-v7.html). v6 не изменён.
  Что исправлено относительно v6 (подробности: design/screens/dashboard.md, раздел «Что отличается от v6»):
  - арифметика: «+3,8%» стало 3,9% (15 400 / 397 400); прибыль IV кв. 2026 считается тождеством (выручка − переменные − постоянные − налоги − обязательства);
    рост к ПРЕДЫДУЩЕМУ кварталу (−1,4%, а не +10,8% к IV кв. 2025); разбивки и итоги сходятся (касса, банк, месяц, прогноз, амортизация, срок годности);
  - в ОПиУ добавлена строка «Обязательства и амортизация»; чистая прибыль августа 152 600 ₽ (была 186 000 ₽ без неё);
  - календарь на 22 дня вперёд (скользящее окно), красный день имеет подпись «ниже запаса»;
  - убраны роли, филиалы, годовая подписка, Telegram-бот, «Врачи», блок «Спросите про свои деньги» и слова «Ответ ИИ»;
  - подсказки привязаны к элементу и открываются с клавиатуры (Tab, Esc) и касанием; на Рабочем столе подсказка у каждой цифры;
  - тёмный мелкий текст вместо #A7A5B2, минимальный шрифт 11px, фокус без чужого радиуса;
  - Рабочий стол: состояния для просмотра (кнопки внизу экрана; только в прототипе).
  Правки этапа 3 (отчёты; спецификации design/screens/pnl.md, norm.md, stock.md):
  - ОПиУ: постоянные расходы раскрыты на «ФОТ» и «Аренда и прочие постоянные»; состав статей сходится с «Нормой» (ФОТ врачей 305 000 = проценты 218 000 + оклады врачей 87 000; препараты и расходники 339 800 = закупка 248 800 + расходные материалы 91 000);
  - ОПиУ, «по направлениям»: вместо прибыльности направлений (функция 19, очередь 2) выручка и маржа услуг и товаров (функция 18), с мостом к маржинальной прибыли 608 000;
  - Норма: норма в рублях точная (0,8% × 1 240 000 = 9 920, перерасход 13 480), шкала с границами зоны, плашки словами, колонка «В рублях», строка «Остальные статьи» (доли сходятся к 100%);
  - Склад: «Срок истекает за 60 дней» вместо «Сгорит», списание Кетофена 7 уп × 1 175 = 8 225 ₽, количества и суммы позиций делятся без остатка, список «Без движения» с интервалами 60–89, 90–179, от 180 дней;
  - кнопки «Скачать Excel» и «Скачать PDF» на трёх отчётах (в прототипе не скачивают).
  Правки по решениям владельца от 14.10.2026 (docs/handoff.md):
  - списание по сроку (23 400 ₽) убрано из строк ОПиУ и из прямых расходов товаров: деньги за товар ушли закупкой. Остаётся справочной строкой в «Норме» и на «Складе». Итоги ОПиУ прежние, потому что 23 400 ₽ в составе «Закупки кормов» 118 400 ₽ это товары для перепродажи (70 200 + 23 400 = 93 600 ₽);
  - Норма: эквайринг 1,0–2,0%; «Остальные статьи» 260 000 ₽ (21,0%); «Списание по сроку» справочно и не входит в вывод; вывод «Одна статья выше нормы»;
  - Склад: оборачиваемость = запас ÷ расход за 90 дней (740 000 × 90 ÷ 900 000 = 74 дня);
  - Рабочий стол: «Прибыль по деньгам» со ссылкой на отчёт «Прибыль и убытки»; «9 дней из 30» (days_passed = день as_of), «Хватит на» считается по окну 28 дней.
  Правки этапа 4 (планирование; спецификации design/screens/calendar.md, obligations.md):
  - платёжный календарь: скользящее окно 22 дня, первый день окна = as_of (9 – 30 сентября), сегодняшний день входит в окно; остаток на утро
    9 сентября 412 800 ₽ = остаток Рабочего стола (банк по вчерашний день и касса); окно переходит через конец месяца; сетка с понедельника недели «сегодня», дни после окна «вне окна»;
  - внутри дня сначала платежи (по убыванию суммы), выручка в конце; у каждого платежа «останется N ₽» или «не хватит N ₽» и источник словами
    (регулярный, обязательство, внесён вручную); у регулярного платежа кнопка «отсрочка N дн.» (задаётся у контрагента, 0 = не переносится);
  - платежи с выходных сдвинуты по правилам: зарплата, аренда и поставщики назад на пятницу, налоги вперёд на понедельник (11 и 21 сентября);
  - прогноз выручки одинаковый для одного дня недели (среднее за 12 полных недель: пн 37 000 … вс 61 000 ₽); итоги 999 000 / 924 600 ₽, 15 платежей,
    самый низкий остаток 16 000 ₽ 11 сентября; 412 800 + 999 000 − 924 600 = 487 200 ₽ на вечер 30 сентября;
  - разрыв: «11 сентября не хватит 30 000 ₽ на платежи» (320 300 − 350 300), к вечеру ниже запаса на 44 000 ₽; перенос «Зоовет» с 10 на 14 сентября
    (12–13 выходные, отсрочка до 5 дней) даёт самый низкий остаток 112 000 ₽, красных дней нет;
  - красный день везде с подписью «ниже запаса» (ячейка, строка, разбор с плашкой); пунктир запаса без прозрачности; свёртка «ещё 1 платёж» без суммы
    (клиент не складывает);
  - обязательства: кредит 12% годовых (проценты сентября 6 200 ₽, основной долг 20 300 ₽, до ноября 2028, выплачено 34,0% из 940 000 ₽);
    лизинг 720 000 ₽, осталось 216 000 ₽ = 18 × 12 000 (до февраля 2028, 70,0%); всего долг 836 000 ₽ (было 840 000 с невозможным сроком лизинга);
    оборудование в лизинге не амортизируется (иначе двойной счёт с платежом по лизингу): амортизация 15 200 ₽ = УЗИ 940 800 ÷ 84 + анализатор 240 000 ÷ 60;
    строка ОПиУ 33 400 ₽ = проценты 6 200 + лизинг 12 000 + амортизация 15 200 (итог и прибыль 152 600 ₽ прежние); подсказки у всех чисел; полосы выплаты одним цветом;
  - кнопки «Добавить платёж», «Добавить кредит или лизинг», «Добавить оборудование», «Изменить», «отсрочка N дн.» у регулярного платежа и ссылка
    «Открыть календарь» у совета о разрыве: решения владельца от 16.10.2026 приняты (docs/handoff.md); в прототипе кнопки не работают (диалоги описаны
    в design/screens/calendar.md и obligations.md); удаление обязательства = «закрыть» с текущего месяца, прошлые начисления остаются.
  Шрифт Onest подключён с Google Fonts только для просмотра прототипа; в продукте он ставится из пакета @fontsource/onest.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --accent:#B8174F; --accent-dark:#8A0F3A; --accent-soft:#F8E1E9; --accent-soft2:#FCF1F5; --accent-mid:#D6567F; --accent-light:#E9A3BB;
  --ink:#15141B; --ink-soft:#6C6B78; --ink-faint:#A7A5B2;
  --bg-soft:#F7F6F9; --sidebar:#15131C; --border:#EDEAF2; --track:#F0EEF4; --control-border:#8E8C9A;
  --ok:#12875E; --ok-ink:#0E7350; --ok-soft:#E1F6ED; --warn:#A6690A; --warn-ink:#8F5A06; --warn-soft:#FDF0D9;
  --bad:#C23A22; --bad-soft:#FCEBE7; --vm:#2563EB; --vm-ink:#1D4ED8; --vm-soft:#E7EFFE;
  --r:20px; --sh:0 1px 2px rgba(20,10,25,.04),0 10px 30px -16px rgba(20,10,25,.14);
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg-soft);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em} p{margin:0} button{font-family:inherit}
::selection{background:var(--accent-soft);color:var(--accent-dark)}
:focus-visible{outline:2.5px solid var(--accent-dark);outline-offset:2px}
.sidebar :focus-visible{outline-color:#fff}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.i{width:1em;height:1em;flex-shrink:0;vertical-align:-.18em;fill:none}
.i .base{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i .pop{fill:var(--accent);stroke:none} .i .popl{fill:var(--accent);opacity:.26;stroke:none}
.i .cut{fill:#fff;stroke:none} .i .cutl{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;padding:20px 13px;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:11px;padding:2px 5px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent-soft2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.brand-name{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.brand-name em{display:block;font-style:normal;font-size:11px;font-weight:500;color:#8C89A0}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:40px;text-align:left;padding:10px 12px;border-radius:12px;background:none;border:0;cursor:pointer;color:#BCBAC7;font-size:13.5px;font-weight:600;transition:.15s var(--ease)}
.nav button .i{font-size:19px;opacity:.9}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:rgba(255,255,255,.11);color:#fff}
.nav .arw{margin-left:auto;font-size:11px;opacity:.7;transition:transform .18s var(--ease)}
.nav button.exp .arw{transform:rotate(90deg)}
.nav .sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px}
.nav .sub button{padding:8px 12px 8px 43px;font-size:13px;font-weight:500;color:#9C99AB}
.nav .sub button.active{background:rgba(255,255,255,.09);color:#fff;font-weight:600}
.nav .sep{height:1px;background:rgba(255,255,255,.09);margin:9px 12px}
.subnav{display:none}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.sfoot .av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.sfoot b{font-size:13px;font-weight:600;display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot .who{min-width:0}
.sfoot .out{background:none;border:0;padding:0;min-height:24px;font-size:12px;color:#8C89A0;cursor:pointer;text-decoration:underline}
.sfoot .out:hover{color:#fff}

.main{flex:1;min-width:0;padding:24px 34px 64px;max-width:1280px}
.view{animation:vin .28s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sk{0%,100%{opacity:1}50%{opacity:.5}}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:800}
.head .sub{font-size:13px;color:var(--ink-soft);margin-top:3px}
.hr2{display:flex;align-items:center;gap:16px}
.tb{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:help;border-radius:6px}
.bal{text-align:right} .bal .v{display:block;font-size:19px;font-weight:800}
.bal .l{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px}
.klabel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px}
h2.klabel{letter-spacing:.08em}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.up{color:var(--ok)} .down{color:var(--bad)} .faint{color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:13px}
.badt{font-size:12px;font-weight:700;color:var(--bad)}

.hero{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:26px 28px 0;margin-bottom:16px;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lbl{display:block;font-size:13px;color:var(--ink-soft)}
.hero .num{display:block;font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:4px 0 2px;white-space:nowrap}
.hero .cap{font-size:12px;color:var(--ink-soft);text-align:right}
.hero .d{font-size:13px;font-weight:600;color:var(--ok)}
.hero .d.neg{color:var(--bad)} .hero .d.zero{color:var(--ink-soft)}
.hero .neg-note{display:block;font-size:13px;font-weight:600;color:var(--bad)}
.chartwrap{position:relative;height:104px;margin-top:12px}
.chartwrap svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.chartwrap path{vector-effect:non-scaling-stroke}
.cpt{position:absolute;top:0;bottom:0;background:none;border:0;padding:0;margin:0;cursor:help}
.cpt:focus-visible{outline-offset:-2px;border-radius:8px}
.cdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);border:2px solid #fff;opacity:0;pointer-events:none;transition:opacity .15s var(--ease)}
.cdot.on,.cdot.last{opacity:1}
.cdot::before{content:'';position:absolute;left:50%;top:100%;width:1px;height:200px;background:var(--accent-light);transform:translateX(-50%);opacity:0}
.cdot.on::before{opacity:1}
.chart-empty{margin-top:12px;height:104px;display:flex;align-items:center;justify-content:center;background:var(--bg-soft);border-radius:12px;font-size:13px;color:var(--ink-soft);text-align:center;padding:0 16px}

.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.acc{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:help;min-height:88px;transition:.18s var(--ease);font:inherit;color:inherit;text-align:left;width:100%}
.acc:hover{transform:translateY(-2px)}
.acc .em{font-size:29px;line-height:1}
.acc .t{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--ink-soft);text-transform:uppercase}
.acc .v{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.acc .s{display:block;font-size:12px;font-weight:600;margin-top:4px;color:var(--ink-soft)}
.acc.hi{background:linear-gradient(135deg,var(--accent),#8A0F3A);border-color:transparent;color:#fff}
.acc.hi .t,.acc.hi .s{color:rgba(255,255,255,.85)}
.hint{margin:-4px 0 22px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:20px;display:flex;align-items:flex-start;gap:13px;min-height:88px;transition:.18s var(--ease)}
.mcard:hover{transform:translateY(-2px)}
.mcard .em{font-size:25px;line-height:1}
.mcard .mc-body{min-width:0}
.mcard .mc-body .tb{display:block}
.mcard .t{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--ink-soft);text-transform:uppercase}
.mcard .v{display:block;font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:3px;white-space:nowrap}
.mcard .s{display:block;font-size:12px;font-weight:600;margin-top:4px;color:var(--ink-soft)}
.mcard .s.bad{color:var(--bad)} .mcard .s.up{color:var(--ok-ink)}

.advl{list-style:none;margin:0;padding:0}
.tip-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;margin-bottom:11px}
.tip-card.al{border-left:3px solid var(--accent)} .tip-card.wr{border-left:3px solid var(--warn)} .tip-card.gd{border-left:3px solid var(--ok)}
.tip-h{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tip-l{display:flex;gap:14px}
.tip-em{font-size:22px;line-height:1.2}
.tip-b .pill{margin-bottom:5px}
.tip-b h3{font-size:16px;font-weight:700;margin-bottom:3px}
.tip-b p{font-size:13px;color:var(--ink-soft);max-width:66ch}
.why{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 15px;min-height:40px;font-size:13px;font-weight:700;color:var(--accent-dark);cursor:pointer;white-space:nowrap}
.why:hover{background:var(--accent-soft2);border-color:var(--accent-soft)}
.why.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ans{margin-top:15px;padding:16px 18px;background:var(--accent-soft2);border-radius:14px;font-size:14px;line-height:1.65;animation:vin .28s var(--ease)}
.ans .who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:6px}
.ans ol{margin:8px 0 0;padding-left:20px} .ans li{margin-bottom:5px}
.ans .src{margin-top:10px;font-size:12px;color:var(--ink-soft)}

.banner{margin-bottom:16px;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.banner.warning{background:var(--warn-soft);color:var(--warn-ink)}
.banner .lnk{background:none;border:0;padding:0;min-height:24px;font:inherit;font-weight:700;color:inherit;text-decoration:underline;cursor:pointer}
.errcard{border-left:3px solid var(--bad)}
.errcard h3,.empty h3{font-size:16px;font-weight:700;margin:8px 0 4px}
.errcard p,.empty p{font-size:13px;color:var(--ink-soft);max-width:66ch}
.empty{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.empty .em{font-size:29px;line-height:1}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sk{display:block;background:var(--track);border-radius:6px;animation:sk 1.4s ease-in-out infinite}
.demo{margin-top:26px;padding:12px 14px;border:1px dashed var(--control-border);border-radius:12px;font-size:12px;color:var(--ink-soft)}
.demo button{margin:4px 4px 0 0;border:1px solid var(--border);background:#fff;border-radius:10px;padding:6px 12px;min-height:32px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer}

  ${SETNAV.map(x=>x[0]==='h'?`<div class="h">${x[1]}</div>`:`<button type="button" data-set="${x[0]}" class="${setTab===x[0]?'on':''}">${x[1]}</button>`).join('')}
 </div><div>${SET[setTab]||''}</div></div>`;

/* ================= РОУТИНГ ================= */
const V={dash:vDash,tx:vTx,price:vPrice,opiu:vOpiu,norm:vNorm,sklad:vSklad,cal:vCal,oblig:vOblig,anal:vAnal,eff:vEff,set:vSet};

function drawNav(){
 document.getElementById('nav').innerHTML=NAV.map(x=>{
  if(x[0]==='sep') return '<div class="sep"></div>';
  if(x[0]==='G'){
   const exp=x[3].some(s=>s[0]===view);
   return `<button type="button" class="${exp?'exp':''}" data-g="${x[2]}" aria-expanded="${exp}">${ic(x[1])}${x[2]}<span class="arw" aria-hidden="true">▸</span></button>`
    + (exp?`<div class="sub">${x[3].map(s=>`<button type="button" data-v="${s[0]}" class="${s[0]===view?'active':''}"${s[0]===view?' aria-current="page"':''}>${s[1]}</button>`).join('')}</div>`:'');
  }
  return `<button type="button" data-v="${x[0]}" class="${x[0]===view?'active':''}"${x[0]===view?' aria-current="page"':''}>${ic(x[1])}${x[2]}</button>`;
 }).join('');
 const grp=NAV.find(x=>x[0]==='G'&&x[3].some(s=>s[0]===view));
 document.getElementById('subnav').innerHTML=grp?grp[3].map(s=>`<button type="button" data-v="${s[0]}" class="${s[0]===view?'active':''}"${s[0]===view?' aria-current="page"':''}>${s[1]}</button>`).join(''):'';
 document.querySelectorAll('#nav button[data-v], #subnav button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;open1=null;drawNav();draw(false);});
 document.querySelectorAll('#nav button[data-g]').forEach(b=>b.onclick=()=>{
  const g=NAV.find(x=>x[0]==='G'&&x[2]===b.dataset.g);
  if(!g[3].some(s=>s[0]===view)){view=g[3][0][0];open1=null;drawNav();draw(false);}
 });
}
function draw(keep){
 closeTip();
 const m=document.getElementById('main'), y=window.scrollY;
 const ak=document.activeElement; let sel=null;
 if(keep&&ak&&ak.dataset){for(const k of ['q','tx','om','stk','sc','set','cm','st','cd']){if(ak.dataset[k]!==undefined){sel=`[data-${k}="${ak.dataset[k]}"]`;break;}}}
 m.innerHTML=`<div class="view">${(V[view]||vDash)()}</div>`;
 document.title=`${({dash:'Рабочий стол',tx:'Транзакции',price:'Прайс услуг',opiu:'Прибыль и убытки',norm:'Норма',sklad:'Склад и сроки',cal:'Платёжный календарь',oblig:'Обязательства',anal:'Финмодель и прогноз',eff:'Эффективность клиники',set:'Настройки'})[view]||'Рабочий стол'} · ВетФинанс`;
 window.scrollTo(0,keep?y:0);
 m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{open1=open1===b.dataset.q?null:b.dataset.q;draw(true);});
 m.querySelectorAll('[data-om]').forEach(b=>b.onclick=()=>{opiuMode=b.dataset.om;draw(true);});
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;open1=null;drawNav();draw(false);});
 m.querySelectorAll('[data-stk]').forEach(b=>b.onclick=()=>{stkTab=b.dataset.stk;draw(true);});
 m.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{txTab=b.dataset.tx;draw(true);});
 m.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scen=b.dataset.sc;open1=null;draw(true);});
 m.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{setTab=b.dataset.set;draw(true);});
 m.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{calMode=b.dataset.cm;draw(true);});
 m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{STATE=b.dataset.st;draw(true);});
 m.querySelectorAll('[data-cd]').forEach(b=>{const go=()=>{calSel=b.dataset.cd;draw(true);};
  b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
 m.querySelectorAll('[data-tip]').forEach(el=>{if(!/^(BUTTON|A)$/.test(el.tagName)&&!el.hasAttribute('tabindex'))el.tabIndex=0;});
 const pts=m.querySelectorAll('.cpt');
 pts.forEach((b,i)=>{b.onkeydown=e=>{
  let j=i; if(e.key==='ArrowLeft')j=i-1; else if(e.key==='ArrowRight')j=i+1; else if(e.key==='Home')j=0; else if(e.key==='End')j=pts.length-1; else return;
  e.preventDefault(); if(j<0||j>=pts.length)return; b.tabIndex=-1; pts[j].tabIndex=0; pts[j].focus();};});
 if(sel){const n=m.querySelector(sel);if(n)n.focus({preventScroll:true});}
}

/* --- подсказка: привязана к элементу, открывается по наведению (80 мс), фокусу и касанию; Esc закрывает --- */
const tipEl=document.getElementById('tip'); let cur=null, openT=null, closeT=null, lastPtr='';
const anchorOf=el=>el.dataset.anchor?(document.getElementById(el.dataset.anchor)||el):el;
function place(el){
 const a=anchorOf(el).getBoundingClientRect(), r=tipEl.getBoundingClientRect();
 let x=a.left+a.width/2-r.width/2; x=Math.max(12,Math.min(x,innerWidth-r.width-12));
 let y=a.bottom+8; if(y+r.height>innerHeight-12&&a.top-8-r.height>=12)y=a.top-8-r.height;
 tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}
function openTip(el){
 clearTimeout(closeT); if(cur===el)return;
 const k=el.dataset.tip; if(!T[k])return;
 closeTip(); cur=el; tipEl.innerHTML=T[k]; tipEl.classList.add('on'); el.setAttribute('aria-describedby','tip');
 if(el.dataset.anchor){const a=document.getElementById(el.dataset.anchor); if(a)a.classList.add('on');}
 place(el);
}
function closeTip(){
 clearTimeout(openT); if(!cur)return;
 cur.removeAttribute('aria-describedby');
 if(cur.dataset.anchor){const a=document.getElementById(cur.dataset.anchor); if(a)a.classList.remove('on');}
 cur=null; tipEl.classList.remove('on');
}
const tipTarget=e=>e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
document.addEventListener('pointerdown',e=>{lastPtr=e.pointerType;});
document.addEventListener('mouseover',e=>{
 if(lastPtr==='touch')return;
 const el=tipTarget(e); if(!el)return;
 clearTimeout(closeT); if(cur===el)return;
 clearTimeout(openT); openT=setTimeout(()=>openTip(el),80);
});
document.addEventListener('mouseout',e=>{
 const el=tipTarget(e); if(!el)return;
 if(e.relatedTarget&&(el.contains(e.relatedTarget)||tipEl.contains(e.relatedTarget)))return;
 clearTimeout(openT); closeT=setTimeout(closeTip,120);
});
tipEl.addEventListener('mouseenter',()=>clearTimeout(closeT));
tipEl.addEventListener('mouseleave',()=>{closeT=setTimeout(closeTip,120);});
document.addEventListener('focusin',e=>{const el=tipTarget(e); if(el&&el.matches(':focus-visible'))openTip(el);});
document.addEventListener('focusout',e=>{if(tipTarget(e))closeTip();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTip();});
document.addEventListener('click',e=>{
 const el=tipTarget(e);
 if(!el){closeTip();return;}
 if(lastPtr==='touch'){ if(cur===el)closeTip(); else openTip(el); }
});
window.addEventListener('scroll',()=>{if(cur)place(cur);},true);
window.addEventListener('resize',()=>{if(cur)place(cur);});

document.getElementById('logo').innerHTML=ic('ic-logo','24px');
drawNav(); draw(false);
</script>
</body>
</html>
